name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  fedora:
    name: Fedora RPM and AppImage
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install build tools
        run: dnf install -y git nodejs-npm rust cargo webkit2gtk4.1-devel openssl-devel curl wget file libappindicator-gtk3-devel librsvg2-devel libxdo-devel glib2-devel gcc gcc-c++ make rpm-build fuse-libs
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Validate release metadata
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            npm run validate:release -- "$GITHUB_REF_NAME"
          else
            npm run validate:release
          fi
      - name: Build Fedora packages
        env:
          NO_STRIP: "1"
        run: npm run tauri --workspace @loofi/supportkit-desktop -- build --bundles rpm,appimage
      - name: Prepare release artifacts
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p release
          cp target/release/bundle/rpm/*.rpm "release/Loofi-SupportKit-${version}-1.x86_64.rpm"
          cp target/release/bundle/appimage/*.AppImage "release/Loofi-SupportKit-${version}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: loofi-supportkit-fedora-x64
          path: release/*
          if-no-files-found: error

  windows:
    name: Windows installer and portable executable
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Validate release metadata
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            npm run validate:release -- "$env:GITHUB_REF_NAME"
          } else {
            npm run validate:release
          }
      - name: Build NSIS installer
        run: npm run tauri --workspace @loofi/supportkit-desktop -- build --bundles nsis
      - name: Prepare release artifacts
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release | Out-Null
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $installer.FullName "release/Loofi-SupportKit-${version}-windows-x64-setup.exe"
          Copy-Item target/release/loofi-supportkit-desktop.exe "release/Loofi-SupportKit-${version}-windows-x64-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: loofi-supportkit-windows-x64
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fedora, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: loofi-supportkit-*
          path: release
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME#v}.md"
          if [[ -f "$notes" ]]; then
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Loofi SupportKit ${GITHUB_REF_NAME}" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Loofi SupportKit ${GITHUB_REF_NAME}" --generate-notes
          fi
