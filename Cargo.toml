[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/supportkit-core",
  "crates/collector-runtime",
  "crates/redaction-engine",
  "crates/report-builder",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
uuid = { version = "1.17", features = ["serde", "v4"] }

